name: remind
description: "REmind - Remember. Organize. Achieve. An offline-first reminder and task-management app."
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
