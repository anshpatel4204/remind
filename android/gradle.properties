android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# --- Network resilience for unstable/slow connections ---
# Gradle normally opens many parallel HTTPS connections to download
# dependencies, which can overwhelm a weak/rate-limited connection and
# cause some of them to fail (DNS lookup errors, TLS handshake resets)
# while others succeed. These settings make it download more patiently,
# one connection at a time, with longer timeouts before giving up.
org.gradle.parallel=false
org.gradle.workers.max=1
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
